<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
    <h1>Formulário de Contato</h1>
    <form onsubmit="enviar(); return false;">
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" placeholder="Digite seu nome"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" placeholder="Digite seu e-mail"><br><br>

        <label for="mensagem">Mensagem:</label><br>
        <textarea id="mensagem" rows="5" cols="40"></textarea><br><br>

        <button onclick="enviar()">Enviar</button>
    </form>
</main>
</body>
</html>
