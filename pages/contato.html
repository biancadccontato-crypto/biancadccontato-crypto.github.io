<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

<header>
  <nav class="navbar">
    <a href="../index.html" class="nav-home" aria-label="Início">
      <i class="ti ti-home"></i>
    </a>
    <div class="nav-links">
      <a href="curriculum.html">Currículo</a>
      <a href="about.html">Sobre Mim</a>
      <a href="receitas.html">Receitas Favoritas</a>
      <a href="contato.html">Contato</a>
      <a href="blog.html">Blog</a>
    </div>
    <div class="nav-actions">
      <button class="nav-btn" id="darkBtn" aria-label="Modo noturno"><i class="ti ti-moon"></i></button>
      <button class="nav-btn" id="a11yBtn" aria-label="Acessibilidade"><i class="ti ti-accessible"></i></button>
    </div>
  </nav>
</header>

<main>
  <section class="page-hero">
    <h1>Contato</h1>
    <p class="subtitulo">Vamos conversar!</p>
  </section>

  <section class="page-content">

    <div class="content-block">
      <h2><i class="ti ti-mail"></i> Envie uma mensagem</h2>
      <form class="form-contato" onsubmit="enviarFormulario(event)">
        <div>
          <label for="nome">Nome</label>
          <input type="text" id="nome" placeholder="Seu nome completo">
          <span class="form-erro" id="erro-nome">Por favor, informe seu nome.</span>
        </div>
        <div>
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com">
          <span class="form-erro" id="erro-email">Por favor, informe um e-mail válido.</span>
        </div>
        <div>
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" placeholder="Escreva sua mensagem..."></textarea>
          <span class="form-erro" id="erro-mensagem">Por favor, escreva uma mensagem.</span>
        </div>
        <button type="submit" class="btn-enviar">Enviar mensagem</button>
        <p id="sucesso-msg" style="display:none; color: #2e7d32; font-size: 14px; margin-top: 8px;">✓ Mensagem enviada com sucesso!</p>
      </form>
    </div>
  </section>
</main>

<footer></footer>
<script src="../js/script.js"></script>
</body>
</html>
